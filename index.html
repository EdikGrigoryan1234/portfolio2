<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <div class="logo">
            <a href class="logo__link"
              ><img src="images/Logo (1).png" alt="Logo"
            /></a>
          </div>
          <nav class="nav">
            <ul class="menu">
              <li class="menu__list"><a href class="menu__link">Home</a></li>
              <li class="menu__list"><a href class="menu__link">About</a></li>
              <li class="menu__list"><a href class="menu__link">Lab</a></li>
            </ul>
          </nav>
        </div>
      </header>
      <main class="main">
        <section class="section1">
          <div class="section1__container">
            <div class="section1__right">
              <div class="section1__images">
                <img
                  src="images/Gradient.png"
                  class="gradient"
                  alt="background"
                />
                <img
                  src="images/image 1.png"
                  alt="image"
                  class="section1__img"
                />
                <div class="sec1__texts">
                  <img src="images/Arrow.png" alt="icon" class="arrow" />
                  <p class="sec1__text1">
                    Hello! I Am
                    <span class="sec1__text2">Edik Grigoryan</span>
                  </p>
                </div>
              </div>
            </div>
            <div class="section1__left">
              <p class="section1__text">A Programmer who</p>
              <h1 class="section1__title">
                Judges a book by its
                <span class="section1__span"
                  >cover<img
                    src="images/Ellipse 5.png"
                    class="ellipse1"
                    alt="Ellipse"
                  />
                </span>
                ...
              </h1>
              <p class="section1__text">
                Because if the cover does not impress you what else can?
              </p>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer"></footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
